<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8700A">
<title>IndoChat</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14213d;--mute:#6b7280;--line:#e5e7eb;--a:#e8700a;--g:#0f6b3a;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#eef1f6;--mute:#9aa3b2;--line:#262c36;--a:#ff8a2b;--g:#2fb36b;--on:#1a1206}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0)}
header{padding:12px 16px;border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--a) 33%,#fff 33% 66%,var(--g) 66%) 1;background:var(--card)}
header b{font-size:20px;letter-spacing:.2px}
header span{display:block;font-size:12px;color:var(--mute)}
main{flex:1;overflow-y:auto;padding:12px 12px 16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:12px 0;background:none;border:0;color:var(--mute);font-size:14px;cursor:pointer}
nav button.on{color:var(--a);font-weight:700;box-shadow:inset 0 3px var(--a)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.txt{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.acts{display:flex;gap:6px}
button{font:inherit;cursor:pointer}
.pri,.card>button:not(.ghost),.row>button:not(.ghost){background:var(--a);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font-weight:700}
.ghost{background:none;border:0;color:var(--ink);padding:6px 8px;border-radius:8px;font-size:15px}
.ghost:active{background:var(--line)}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:70px;resize:vertical}
.row input{margin:0;flex:1}
.auth{max-width:380px;margin:6vh auto 0}
.auth h2{margin-bottom:4px}.auth p{margin-bottom:14px}
.auth button.pri{width:100%;margin:4px 0 12px}
.link{background:none;border:0;color:var(--a);font-weight:700;padding:0}
.list{max-height:46vh;overflow-y:auto;margin:8px 0}
.chat{max-height:none;height:calc(100vh - 230px);display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--g);color:#fff;border-color:var(--g)}
.click{cursor:pointer}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden],nav[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:9}
#toast[hidden]{display:none}
</style>
</head>
<body>
<header><b>IndoChat</b><span>Connect • Share • Belong</span></header>
<main id="app"><p class="mute">Load ho raha hai...</p></main>
<nav id="nav" hidden>
  <button data-a="tab" data-t="home">Home</button>
  <button data-a="tab" data-t="msgs">Messages</button>
  <button data-a="tab" data-t="me">Profile</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, updateDoc, arrayUnion, arrayRemove, increment, onSnapshot, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB25r-e3o9jv37m4rbJEXu_281GKzc7cEE",
  authDomain: "indochat-3196f.firebaseapp.com",
  projectId: "indochat-3196f",
  storageBucket: "indochat-3196f.firebasestorage.app",
  messagingSenderId: "1080845203501",
  appId: "1:1080845203501:web:8d81114536c863265ae0a4"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, tab = "home", subs = [], csub = null, signingUp = false;
const nameOf = u => u.displayName || (u.email || "user").split("@")[0];
const clearSubs = () => { subs.forEach(u => u()); subs = []; };
const when = ts => ts && ts.toDate ? ts.toDate().toLocaleString("en-IN", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "abhi";
let tt;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); }
const errMsg = e => ({
  "auth/invalid-credential":"Email ya password galat hai.",
  "auth/wrong-password":"Password galat hai.",
  "auth/user-not-found":"Is email se koi account nahi hai.",
  "auth/email-already-in-use":"Ye email pehle se use ho chuka hai. Login karo.",
  "auth/weak-password":"Password kam se kam 6 akshar ka rakho.",
  "auth/invalid-email":"Email sahi se likho.",
  "auth/network-request-failed":"Internet check karo aur dobara try karo.",
  "auth/too-many-requests":"Bahut koshish ho gayi. Thodi der baad try karo.",
  "auth/operation-not-allowed":"Firebase mein Email/Password login on karo.",
  "auth/unauthorized-domain":"Firebase > Authentication > Settings > Authorized domains mein is site ka domain jodo.",
  "auth/invalid-api-key":"Firebase config ki apiKey galat hai. Dobara copy karo.",
  "permission-denied":"Permission nahi mili. Firestore rules check karo."
}[e.code] || ("Kuch gadbad hui: " + (e.code || e.message)));

/* ---------- Auth screen ---------- */
function authView(mode = "login"){
  const su = mode === "signup";
  $("#nav").hidden = true;
  $("#app").innerHTML = `<div class="card auth">
    <h2>${su ? "Naya account banao" : "Wapas aao"}</h2>
    <p class="mute">${su ? "Naam, email aur password daalo." : "Email aur password se login karo."}</p>
    ${su ? `<input id="n" placeholder="Aapka naam" maxlength="40" autocomplete="name">` : ""}
    <input id="e" type="email" placeholder="Email" autocomplete="email">
    <input id="p" type="password" placeholder="Password (kam se kam 6 akshar)" autocomplete="${su ? "new-password" : "current-password"}">
    <button class="pri" data-a="${su ? "signup" : "login"}">${su ? "Account banao" : "Login karo"}</button>
    <p class="mute">${su ? "Pehle se account hai?" : "Naye ho?"} <button class="link" data-a="authmode" data-m="${su ? "login" : "signup"}">${su ? "Login karo" : "Account banao"}</button></p>
  </div>`;
}
async function ensureUser(u, name){
  try { await setDoc(doc(db, "users", u.uid), { name: name || nameOf(u), email: u.email }, { merge: true }); } catch(e){}
}

/* ---------- Home ---------- */
function postHtml(id, p){
  const likes = p.likes || [], liked = likes.includes(me.uid);
  return `<article class="card">
    <div class="row"><div class="av">${esc((p.name || "?")[0].toUpperCase())}</div>
      <div class="grow"><b>${esc(p.name)}</b><div class="mute">${when(p.createdAt)}</div></div>
      ${p.uid === me.uid ? `<button class="ghost" data-a="del" data-id="${id}" aria-label="Post hatao">🗑</button>` : ""}</div>
    <p class="txt">${esc(p.text)}</p>
    <div class="acts">
      <button class="ghost" data-a="like" data-id="${id}" data-l="${liked ? 1 : 0}">${liked ? "❤️" : "🤍"} ${likes.length}</button>
      <button class="ghost" data-a="cmt" data-id="${id}">💬 ${p.cc || 0}</button>
    </div></article>`;
}
function home(){
  $("#app").innerHTML = `<div class="card"><textarea id="t" maxlength="500" placeholder="Bharat mein kya chal raha hai?"></textarea><button data-a="post">Post karo</button></div><div id="feed"></div>`;
  subs.push(onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50)), snap => {
    $("#feed").innerHTML = snap.docs.map(d => postHtml(d.id, d.data())).join("") || `<p class="mute">Abhi koi post nahi hai. Pehli post aap karo.</p>`;
  }, e => toast(errMsg(e))));
}

/* ---------- Comments ---------- */
function openComments(id){
  const s = $("#sheet"); s.hidden = false;
  s.innerHTML = `<div class="sheet"><div class="row"><b class="grow">Comments</b><button class="ghost" data-a="close">✕</button></div>
    <div id="cl" class="list"></div>
    <div class="row"><input id="ci" maxlength="300" placeholder="Comment likho"><button data-a="csend" data-id="${id}">Bhejo</button></div></div>`;
  csub = onSnapshot(query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc")), snap => {
    $("#cl").innerHTML = snap.docs.map(d => { const c = d.data();
      return `<div class="card"><b>${esc(c.name)}</b> <span class="mute">${when(c.createdAt)}</span><p class="txt" style="margin:4px 0 0">${esc(c.text)}</p></div>`; }).join("") || `<p class="mute">Abhi koi comment nahi hai.</p>`;
  }, e => toast(errMsg(e)));
}
function closeSheet(){ if (csub) { csub(); csub = null; } $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }

/* ---------- Messages ---------- */
function msgs(){
  $("#app").innerHTML = `<h3 style="margin:4px 4px 10px">Messages</h3><div id="ul"></div>`;
  subs.push(onSnapshot(collection(db, "users"), snap => {
    const l = snap.docs.filter(d => d.id !== me.uid).map(d => { const u = d.data();
      return `<div class="card row click" data-a="chat" data-id="${d.id}" data-n="${esc(u.name)}"><div class="av">${esc((u.name || "?")[0].toUpperCase())}</div><div class="grow"><b>${esc(u.name)}</b><div class="mute">Chat kholo</div></div></div>`; });
    $("#ul").innerHTML = l.join("") || `<p class="mute">Abhi koi aur user nahi hai. Dost ko app ka link bhejo.</p>`;
  }, e => toast(errMsg(e))));
}
function chat(uid, name){
  clearSubs();
  const cid = [me.uid, uid].sort().join("_");
  $("#app").innerHTML = `<div class="row"><button class="ghost" data-a="tab" data-t="msgs">←</button><b>${esc(name)}</b></div>
    <div id="ml" class="list chat"></div>
    <div class="row"><input id="mi" maxlength="500" placeholder="Message likho"><button data-a="msend" data-c="${cid}">Bhejo</button></div>`;
  subs.push(onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("createdAt", "asc"), limit(200)), snap => {
    const ml = $("#ml");
    ml.innerHTML = snap.docs.map(d => { const m = d.data();
      return `<div class="b ${m.from === me.uid ? "me" : ""}">${esc(m.text)}</div>`; }).join("") || `<p class="mute">Pehla message aap bhejo.</p>`;
    ml.scrollTop = ml.scrollHeight;
  }, e => toast(errMsg(e))));
}

/* ---------- Profile ---------- */
function profile(){
  $("#app").innerHTML = `<div class="card"><div class="row"><div class="av">${esc(nameOf(me)[0].toUpperCase())}</div><div class="grow"><b>${esc(nameOf(me))}</b><div class="mute">${esc(me.email)}</div></div></div></div>
    <div class="card"><button data-a="logout">Logout</button></div>`;
}

function go(t){
  tab = t; clearSubs(); closeSheet();
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ({ home, msgs, me: profile })[t]();
}

/* ---------- Actions ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if (a === "authmode") authView(b.dataset.m);
    else if (a === "tab") go(b.dataset.t);
    else if (a === "login") {
      await signInWithEmailAndPassword(auth, $("#e").value.trim(), $("#p").value);
    } else if (a === "signup") {
      const n = $("#n").value.trim(), em = $("#e").value.trim(), p = $("#p").value;
      if (!n) return toast("Apna naam likho.");
      signingUp = true;
      const c = await createUserWithEmailAndPassword(auth, em, p);
      await updateProfile(c.user, { displayName: n });
      await ensureUser(c.user, n);
      signingUp = false; me = auth.currentUser; go("home");
    } else if (a === "logout") { await signOut(auth); }
    else if (a === "post") {
      const t = $("#t").value.trim(); if (!t) return toast("Pehle kuch likho.");
      b.disabled = true;
      await addDoc(collection(db, "posts"), { uid: me.uid, name: nameOf(me), text: t, likes: [], cc: 0, createdAt: serverTimestamp() });
      $("#t").value = ""; b.disabled = false;
    } else if (a === "like") {
      const liked = b.dataset.l === "1";
      await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(me.uid) : arrayUnion(me.uid) });
    } else if (a === "del") {
      if (confirm("Ye post hatani hai?")) await deleteDoc(doc(db, "posts", id));
    } else if (a === "cmt") openComments(id);
    else if (a === "close") closeSheet();
    else if (a === "csend") {
      const t = $("#ci").value.trim(); if (!t) return;
      $("#ci").value = "";
      await addDoc(collection(db, "posts", id, "comments"), { uid: me.uid, name: nameOf(me), text: t, createdAt: serverTimestamp() });
      await updateDoc(doc(db, "posts", id), { cc: increment(1) });
    } else if (a === "chat") chat(id, b.dataset.n);
    else if (a === "msend") {
      const t = $("#mi").value.trim(); if (!t) return;
      $("#mi").value = "";
      await addDoc(collection(db, "chats", b.dataset.c, "messages"), { from: me.uid, text: t, createdAt: serverTimestamp() });
    }
  } catch (err) { signingUp = false; toast(errMsg(err)); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  const id = e.target.id;
  if (id === "ci") document.querySelector('[data-a="csend"]').click();
  else if (id === "mi") document.querySelector('[data-a="msend"]').click();
  else if (id === "p") document.querySelector('[data-a="login"],[data-a="signup"]').click();
});

onAuthStateChanged(auth, async u => {
  me = u;
  if (!u) { clearSubs(); closeSheet(); authView("login"); return; }
  if (signingUp) return;
  $("#nav").hidden = false;
  ensureUser(u);
  go(tab);
});
</script>
</body>
</html>

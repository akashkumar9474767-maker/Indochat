<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E8700A">
<title>IndoChat</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mute:#6b7280;--line:#e5e7eb;--a:#e8700a;--g:#0f6b3a;--on:#fff;--tag:#2563eb}
:root[data-theme=dark]{--bg:#0e1116;--card:#171b22;--ink:#eef1f6;--mute:#9aa3b2;--line:#262c36;--a:#ff8a2b;--g:#2fb36b;--on:#1a1206;--tag:#60a5fa}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#171b22;--ink:#eef1f6;--mute:#9aa3b2;--line:#262c36;--a:#ff8a2b;--g:#2fb36b;--on:#1a1206;--tag:#60a5fa}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:3px solid transparent;border-image:linear-gradient(90deg,var(--a) 33%,#fff 33% 66%,var(--g) 66%) 1}
header b{font-size:20px}header span{display:block;font-size:11px;color:var(--mute)}
.hr{display:flex;gap:4px}
.hr button{position:relative;background:none;color:var(--ink);font-size:20px;padding:6px 8px}
#bd{position:absolute;top:0;right:0;background:#dc2626;color:#fff;font-style:normal;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
#bd[hidden]{display:none}
main{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 16px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:none;color:var(--mute);font-size:11px;font-weight:500;border-radius:0}
nav button span{font-size:18px;padding:2px 16px;border-radius:14px}
nav button.on{color:var(--a);font-weight:700}
nav button.on span{background:color-mix(in srgb,var(--a) 18%,transparent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:12px}.pad{padding:14px;text-align:center}
.click{cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:84px;height:84px;font-size:32px;margin:0 auto 8px}
.txt{margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5}
.tag{color:var(--tag);font-weight:600;cursor:pointer}
.gcard{border-radius:12px;min-height:170px;display:grid;place-items:center;text-align:center;padding:22px;color:#fff;font-size:21px;font-weight:700;line-height:1.35;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.gcard .tag{color:#fff;text-decoration:underline}
.pimg{width:100%;border-radius:12px;margin:8px 0;max-height:520px;object-fit:cover;background:var(--line);display:block}
.cnt{padding:2px 0 6px}
.acts{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:4px}
button{font:inherit;cursor:pointer;background:var(--a);color:var(--on);border:0;border-radius:10px;padding:10px 14px;font-weight:700}
button:disabled{opacity:.6}
.ghost{background:none;color:var(--ink);padding:6px 8px;font-weight:400;font-size:14px}
.ghost:active{background:var(--line)}
.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.link{background:none;color:var(--a);padding:0}
textarea,input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
textarea{min-height:90px;resize:vertical}
.row input{margin:0;flex:1}
.auth{max-width:380px;margin:6vh auto 0}.auth h2{margin-bottom:4px}.auth p{margin-bottom:14px}
.auth .go{width:100%;margin:4px 0 12px}
.stories{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 12px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mute);cursor:pointer;flex:none;width:66px}
.st span{max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,var(--a),#fff,var(--g));display:grid;place-items:center}
.ring .av{width:100%;height:100%;border:3px solid var(--bg)}
.ring.plus{background:var(--card);border:2px dashed var(--a);color:var(--a);font-size:28px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-weight:500;font-size:14px}
.chip.on{background:var(--a);color:var(--on);border-color:var(--a)}
.compose{display:flex;align-items:center;gap:10px;color:var(--mute)}
.sws{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.pv{position:relative;margin-bottom:8px}.pv img{width:100%;border-radius:10px;max-height:300px;object-fit:cover}
.pv button{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%}
.prof{text-align:center}.pn{font-size:18px}.bio{margin:8px 0;white-space:pre-wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:10px 0}
.stats b{display:block;font-size:18px}.stats span{font-size:12px;color:var(--mute)}
.prof .row{justify-content:center}
.list{max-height:46vh;overflow-y:auto;margin:8px 0}
.chat{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;max-height:none}
.cv{display:flex;flex-direction:column;height:100%}
.cv>.row{flex:none}.cv>.row:first-child{margin-bottom:8px}
.b{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:var(--g);color:#fff;border-color:var(--g)}
.unr{border-color:var(--a)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#sheet[hidden],nav[hidden],#sv[hidden],#toast[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0))}
.sheet textarea,.sheet input{margin-top:8px}
#sv{position:fixed;inset:0;background:#000;z-index:8}
.svb{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;color:#fff;padding-top:env(safe-area-inset-top,0)}
.bars{display:flex;gap:4px;padding:10px 10px 6px}.bars i{flex:1;height:3px;background:rgba(255,255,255,.3);border-radius:2px}.bars i.f{background:#fff}
.svh{padding:4px 10px}.svh .ghost{color:#fff}.svh .mute{color:#ddd}
.sbody{flex:1;display:grid;place-items:center;text-align:center;padding:20px;cursor:pointer;overflow:hidden}
.sbody img{max-width:100%;max-height:100%;object-fit:contain}
.sbody p{font-size:24px;font-weight:700;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:9}
</style>
</head>
<body>
<header>
  <div><b>IndoChat 🇮🇳</b><span>Connect • Share • Belong</span></div>
  <div class="hr"><button data-a="theme" id="th" aria-label="Dark mode">🌙</button><button data-a="notifs" aria-label="Notifications">🔔<i id="bd" hidden>0</i></button></div>
</header>
<main id="app"><p class="mute">Load ho raha hai...</p></main>
<nav id="nav" hidden>
  <button data-a="tab" data-t="home"><span>🏠</span>Home</button>
  <button data-a="tab" data-t="explore"><span>🔍</span>Explore</button>
  <button data-a="tab" data-t="create"><span>➕</span>Create</button>
  <button data-a="tab" data-t="msgs"><span>💬</span>Messages</button>
  <button data-a="tab" data-t="me"><span>👤</span>Profile</button>
</nav>
<div id="sheet" hidden></div>
<div id="sv" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, setDoc, deleteDoc, updateDoc, arrayUnion, arrayRemove, increment, onSnapshot, query, where, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB25r-e3o9jv37m4rbJEXu_281GKzc7cEE",
  authDomain: "indochat-3196f.firebaseapp.com",
  projectId: "indochat-3196f",
  storageBucket: "indochat-3196f.firebasestorage.app",
  messagingSenderId: "1080845203501",
  appId: "1:1080845203501:web:8d81114536c863265ae0a4"
};
// Photo upload (Cloudinary free). Jab tak ye dono khali hain, photo button nahi dikhega.
const CLOUD = "";
const PRESET = "";
const PHOTO = !!(CLOUD && PRESET);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BGS = ["linear-gradient(135deg,#ff9933,#e8450a)","linear-gradient(135deg,#138808,#0b4d2a)","linear-gradient(135deg,#2b59c3,#1b2a6b)","linear-gradient(135deg,#8e2de2,#4a00e0)","linear-gradient(135deg,#f953c6,#b91d73)","linear-gradient(135deg,#374151,#111827)"];
const HT = /(^|\s)#[\p{L}\p{N}_]+/gu;
let me = null, my = {}, nlist = [], tab = "home", subs = [], gsubs = [], csub = null, signingUp = false;
let redraw = null, homeF = "all", xq = "", psub = "posts", savedPosts = [], bgSel = null, fileSel = null, profFile = null, sv = null, unrSet = new Set();
let sv_groups = [];

const nameOf = u => (my && my.name) || u.displayName || (u.email || "user").split("@")[0];
const handle = () => (me.email || "").split("@")[0];
const clearSubs = () => { subs.forEach(u => u()); subs = []; };
const ms = x => (x.createdAt && x.createdAt.toMillis) ? x.createdAt.toMillis() : Date.now();
const when = ts => ts && ts.toDate ? ts.toDate().toLocaleString("en-IN", {day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"}) : "abhi";
const avatar = (name, ph) => (ph && /^https:\/\//.test(ph)) ? `<img src="${esc(ph)}" alt="">` : esc(((name || "?")[0] || "?").toUpperCase());
const tags = t => esc(t).replace(/(^|\s)(#[\p{L}\p{N}_]+)/gu, (m, a, h) => `${a}<span class="tag" data-a="tag" data-t="${h}">${h}</span>`);
let tt;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); }
const errMsg = e => ({
  "auth/invalid-credential":"Email ya password galat hai.",
  "auth/wrong-password":"Password galat hai.",
  "auth/user-not-found":"Is email se koi account nahi hai.",
  "auth/email-already-in-use":"Ye email pehle se use ho chuka hai. Login karo.",
  "auth/weak-password":"Password kam se kam 6 akshar ka rakho.",
  "auth/invalid-email":"Email sahi se likho.",
  "auth/network-request-failed":"Internet check karo aur dobara try karo.",
  "auth/too-many-requests":"Bahut koshish ho gayi. Thodi der baad try karo.",
  "auth/unauthorized-domain":"Firebase > Authentication > Settings > Authorized domains mein is site ka domain jodo.",
  "permission-denied":"Permission nahi mili. Firestore rules check karo."
}[e.code] || (e.message === "photo-fail" ? "Photo upload nahi hui. Dobara try karo." : "Kuch gadbad hui: " + (e.code || e.message)));

/* ---------- theme ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; $("#th").textContent = t === "dark" ? "☀️" : "🌙"; try { localStorage.setItem("th", t); } catch(e){} }
(() => { let t = null; try { t = localStorage.getItem("th"); } catch(e){} if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; setTheme(t); })();

/* ---------- photo upload ---------- */
function shrink(file, max){
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? res(b) : rej(new Error("photo-fail")), "image/jpeg", 0.82);
    };
    img.onerror = () => rej(new Error("photo-fail"));
    img.src = URL.createObjectURL(file);
  });
}
async function uploadImg(file){
  const blob = await shrink(file, 1080);
  const fd = new FormData(); fd.append("file", blob); fd.append("upload_preset", PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`, { method: "POST", body: fd });
  const j = await r.json();
  if (!j.secure_url) throw new Error("photo-fail");
  return j.secure_url;
}

/* ---------- auth screen ---------- */
function authView(mode = "login"){
  const su = mode === "signup";
  $("#nav").hidden = true;
  $("#app").innerHTML = `<div class="card auth">
    <h2>${su ? "Naya account banao" : "Wapas aao"}</h2>
    <p class="mute">${su ? "Naam, email aur password daalo." : "Email aur password se login karo."}</p>
    ${su ? `<input id="n" placeholder="Aapka naam" maxlength="40" autocomplete="name">` : ""}
    <input id="e" type="email" placeholder="Email" autocomplete="email">
    <input id="p" type="password" placeholder="Password (kam se kam 6 akshar)" autocomplete="${su ? "new-password" : "current-password"}">
    <button class="go" data-a="${su ? "signup" : "login"}">${su ? "Account banao" : "Login karo"}</button>
    <p class="mute">${su ? "Pehle se account hai?" : "Naye ho?"} <button class="link" data-a="authmode" data-m="${su ? "login" : "signup"}">${su ? "Login karo" : "Account banao"}</button></p>
  </div>`;
}
async function ensureUser(u, name){
  try {
    const r = doc(db, "users", u.uid), s = await getDoc(r);
    if (!s.exists()) await setDoc(r, { name: name || u.displayName || (u.email || "user").split("@")[0], email: u.email, h: (u.email || "").split("@")[0], bio: "", ph: null, following: [], saved: [] });
  } catch(e){}
}
async function notify(to, type, postId, text){
  if (!to || to === me.uid) return;
  try { await addDoc(collection(db, "notifs"), { to, from: me.uid, fromName: nameOf(me), type, postId: postId || null, text: text || "", read: false, createdAt: serverTimestamp() }); } catch(e){}
}

/* ---------- posts ---------- */
function postHtml(id, p){
  const likes = p.likes || [], liked = likes.includes(me.uid), saved = (my.saved || []).includes(id);
  const body = (p.bg != null && !p.img)
    ? `<div class="gcard" style="background:${BGS[p.bg] || BGS[0]}">${tags(p.text)}</div>`
    : (p.text ? `<p class="txt">${tags(p.text)}</p>` : "");
  const img = (p.img && /^https:\/\//.test(p.img)) ? `<img class="pimg" src="${esc(p.img)}" loading="lazy" alt="">` : "";
  return `<article class="card">
    <div class="row"><div class="av" data-a="prof" data-u="${p.uid}">${avatar(p.name, p.ph)}</div>
      <div class="grow"><b class="click" data-a="prof" data-u="${p.uid}">${esc(p.name)}</b><div class="mute">@${esc(p.h || "")} • ${when(p.createdAt)}</div></div>
      ${p.uid === me.uid ? `<button class="ghost" data-a="del" data-id="${id}" aria-label="Post hatao">🗑</button>` : ""}</div>
    ${body}${img}
    <div class="mute cnt">${likes.length} Likes • ${p.cc || 0} Comments</div>
    <div class="acts">
      <button class="ghost" data-a="like" data-id="${id}" data-o="${p.uid}" data-l="${liked ? 1 : 0}">${liked ? "❤️" : "🤍"} Like</button>
      <button class="ghost" data-a="cmt" data-id="${id}" data-o="${p.uid}">💬 Comment</button>
      <button class="ghost" data-a="share">↗️ Share</button>
      <button class="ghost" data-a="save" data-id="${id}" data-s="${saved ? 1 : 0}">${saved ? "🔖" : "📑"} Save</button>
    </div></article>`;
}
function composer(kind){
  const sw = BGS.map((g, i) => `<button class="sw" data-a="bg" data-i="${i}" style="background:${g}" aria-label="Rang ${i + 1}"></button>`).join("");
  return `<textarea id="ct" maxlength="${kind === "post" ? 500 : 200}" placeholder="${kind === "post" ? "Bharat mein kya chal raha hai?" : "Story mein kya likhna hai?"}"></textarea>
    <div id="cp"></div>
    <div id="sws" class="sws"><span class="mute">Rang:</span>${sw}</div>
    <div class="row">${PHOTO ? `<button class="sec" data-a="pick">📷 Photo</button>` : ""}<button data-a="${kind === "post" ? "post" : "spost"}">${kind === "post" ? "Post karo" : "Story lagao"}</button></div>
    <input type="file" id="cf" accept="image/*" hidden>`;
}
function applyBg(){
  const t = $("#ct"); if (!t) return;
  const on = bgSel != null && !fileSel;
  t.style.background = on ? BGS[bgSel] : ""; t.style.color = on ? "#fff" : ""; t.style.textAlign = on ? "center" : "";
  document.querySelectorAll(".sw").forEach((b, i) => b.classList.toggle("on", i === bgSel));
  const s = $("#sws"); if (s) s.hidden = !!fileSel;
}
async function submit(kind, btn){
  const t = $("#ct").value.trim();
  if (!t && !fileSel) return toast("Kuch likho ya photo chuno.");
  const label = btn.textContent; btn.disabled = true; btn.textContent = "Bhej raha hu...";
  try {
    let img = null; if (fileSel) img = await uploadImg(fileSel);
    const bg = img ? null : (bgSel != null ? bgSel : (kind === "story" ? 0 : null));
    const base = { uid: me.uid, name: nameOf(me), ph: my.ph || null, text: t, img, bg, createdAt: serverTimestamp() };
    if (kind === "post") await addDoc(collection(db, "posts"), { ...base, h: handle(), likes: [], cc: 0 });
    else await addDoc(collection(db, "stories"), base);
    fileSel = null; bgSel = null;
    if (kind === "post") go("home"); else closeSheet();
  } catch(e){ toast(errMsg(e)); btn.disabled = false; btn.textContent = label; }
}

function home(){
  $("#app").innerHTML = `<div id="sr"></div>
    <div class="card compose click" data-a="tab" data-t="create"><div class="av">${avatar(nameOf(me), my.ph)}</div><span>Bharat mein kya chal raha hai? Share karo...</span></div>
    <div id="hc" class="chips"></div><div id="feed"></div>`;
  let docs = [], sd = [];
  const draw = () => {
    $("#hc").innerHTML = `<button class="chip ${homeF === "all" ? "on" : ""}" data-a="hf" data-f="all">Sab</button><button class="chip ${homeF === "fol" ? "on" : ""}" data-a="hf" data-f="fol">Following</button>`;
    const fol = my.following || [];
    const list = docs.filter(d => homeF === "all" || d.data().uid === me.uid || fol.includes(d.data().uid));
    $("#feed").innerHTML = list.map(d => postHtml(d.id, d.data())).join("") || `<p class="mute pad">${homeF === "fol" ? "Jinhe follow karte ho unki post yahan dikhegi. Explore se logon ko dhundo." : "Abhi koi post nahi hai. Pehli post aap karo."}</p>`;
    const cut = Date.now() - 864e5, groups = [], idx = {};
    sd.filter(x => !x.createdAt || x.createdAt.toMillis() > cut).forEach(x => {
      if (idx[x.uid] == null) { idx[x.uid] = groups.length; groups.push({ uid: x.uid, name: x.name, ph: x.ph, items: [] }); }
      groups[idx[x.uid]].items.push(x);
    });
    groups.forEach(g => g.items.sort((a, b) => ms(a) - ms(b)));
    sv_groups = groups;
    $("#sr").innerHTML = `<div class="stories"><div class="st" data-a="newstory"><div class="ring plus">+</div><span>Your Story</span></div>${groups.map(g => `<div class="st" data-a="story" data-u="${g.uid}"><div class="ring"><div class="av">${avatar(g.name, g.ph)}</div></div><span>${esc((g.name || "").split(" ")[0])}</span></div>`).join("")}</div>`;
  };
  redraw = draw; draw();
  subs.push(onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(50)), s => { docs = s.docs; draw(); }, e => toast(errMsg(e))));
  subs.push(onSnapshot(query(collection(db, "stories"), orderBy("createdAt", "desc"), limit(60)), s => { sd = s.docs.map(d => ({ id: d.id, ...d.data() })); draw(); }, () => {}));
}

/* ---------- stories ---------- */
function showStory(){
  const s = $("#sv"), it = sv.items[sv.i]; if (!it) return closeStory();
  s.hidden = false;
  s.innerHTML = `<div class="svb"><div class="bars">${sv.items.map((_, k) => `<i class="${k <= sv.i ? "f" : ""}"></i>`).join("")}</div>
    <div class="row svh"><div class="av">${avatar(it.name, it.ph)}</div><b class="grow">${esc(it.name)}</b><span class="mute">${when(it.createdAt)}</span>
    ${it.uid === me.uid ? `<button class="ghost" data-a="sdel" data-id="${it.id}">🗑</button>` : ""}<button class="ghost" data-a="sclose">✕</button></div>
    <div class="sbody" data-a="snext" style="background:${it.img ? "#000" : (BGS[it.bg] || BGS[0])}">${(it.img && /^https:\/\//.test(it.img)) ? `<img src="${esc(it.img)}" alt="">` : ""}${it.text ? `<p>${esc(it.text)}</p>` : ""}</div></div>`;
}
function closeStory(){ sv = null; const s = $("#sv"); s.hidden = true; s.innerHTML = ""; }
function openComposeSheet(kind){
  fileSel = null; bgSel = null;
  const s = $("#sheet"); s.hidden = false;
  s.innerHTML = `<div class="sheet"><div class="row"><b class="grow">Nayi Story (24 ghante)</b><button class="ghost" data-a="close">✕</button></div>${composer(kind)}</div>`;
}

/* ---------- comments ---------- */
function openComments(id, owner){
  const s = $("#sheet"); s.hidden = false;
  s.innerHTML = `<div class="sheet"><div class="row"><b class="grow">Comments</b><button class="ghost" data-a="close">✕</button></div>
    <div id="cl" class="list"></div>
    <div class="row"><input id="ci" maxlength="300" placeholder="Comment likho"><button data-a="csend" data-id="${id}" data-o="${owner || ""}">Bhejo</button></div></div>`;
  if (csub) csub();
  csub = onSnapshot(query(collection(db, "posts", id, "comments"), orderBy("createdAt", "asc")), snap => {
    $("#cl").innerHTML = snap.docs.map(d => { const c = d.data();
      return `<div class="card"><b>${esc(c.name)}</b> <span class="mute">${when(c.createdAt)}</span><p class="txt" style="margin:4px 0 0">${esc(c.text)}</p></div>`; }).join("") || `<p class="mute">Abhi koi comment nahi hai.</p>`;
  }, e => toast(errMsg(e)));
}
function closeSheet(){ if (csub) { csub(); csub = null; } const s = $("#sheet"); s.hidden = true; s.innerHTML = ""; }

/* ---------- explore ---------- */
function explore(){
  $("#app").innerHTML = `<input id="q" placeholder="🔍 Hashtag, naam ya post khojo" value="${esc(xq)}"><div id="tg" class="chips"></div><div id="xl"></div>`;
  let docs = [];
  const draw = () => {
    const q = xq.trim().toLowerCase(), counts = {};
    docs.forEach(d => (d.data().text || "").match(HT)?.forEach(t => { t = t.trim().toLowerCase(); counts[t] = (counts[t] || 0) + 1; }));
    $("#tg").innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([t, n]) => `<button class="chip" data-a="tag" data-t="${esc(t)}">${esc(t)} • ${n}</button>`).join("");
    const list = docs.filter(d => { const p = d.data(); return !q || (p.text || "").toLowerCase().includes(q) || (p.name || "").toLowerCase().includes(q); });
    $("#xl").innerHTML = list.map(d => postHtml(d.id, d.data())).join("") || `<p class="mute pad">Kuch nahi mila.</p>`;
  };
  redraw = draw; draw();
  subs.push(onSnapshot(query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(100)), s => { docs = s.docs; draw(); }, e => toast(errMsg(e))));
}
function create(){ fileSel = null; bgSel = null; $("#app").innerHTML = `<div class="card">${composer("post")}</div>`; }

/* ---------- messages ---------- */
function msgs(){
  $("#app").innerHTML = `<h3 style="margin:4px 4px 10px">Messages</h3><div id="ul"></div>`;
  subs.push(onSnapshot(collection(db, "users"), snap => {
    const l = snap.docs.filter(d => d.id !== me.uid).map(d => { const u = d.data();
      return `<div class="card row click" data-a="chat" data-id="${d.id}" data-n="${esc(u.name)}"><div class="av">${avatar(u.name, u.ph)}</div><div class="grow"><b>${esc(u.name)}</b><div class="mute">Chat kholo</div></div></div>`; });
    $("#ul").innerHTML = l.join("") || `<p class="mute pad">Abhi koi aur user nahi hai. Dost ko app ka link bhejo.</p>`;
  }, e => toast(errMsg(e))));
}
function chat(uid, name){
  const cid = [me.uid, uid].sort().join("_");
  $("#app").innerHTML = `<div class="cv"><div class="row"><button class="ghost" data-a="tab" data-t="msgs">←</button><b class="click" data-a="prof" data-u="${uid}">${esc(name)}</b></div>
    <div id="ml" class="list chat"></div>
    <div class="row"><input id="mi" maxlength="500" placeholder="Message likho"><button data-a="msend" data-c="${cid}">Bhejo</button></div></div>`;
  subs.push(onSnapshot(query(collection(db, "chats", cid, "messages"), orderBy("createdAt", "asc"), limit(200)), snap => {
    const ml = $("#ml");
    ml.innerHTML = snap.docs.map(d => { const m = d.data(); return `<div class="b ${m.from === me.uid ? "me" : ""}">${esc(m.text)}</div>`; }).join("") || `<p class="mute">Pehla message aap bhejo.</p>`;
    ml.scrollTop = ml.scrollHeight;
  }, e => toast(errMsg(e))));
}

/* ---------- notifications ---------- */
function notifView(){
  unrSet = new Set(nlist.filter(n => !n.read).map(n => n.id));
  $("#app").innerHTML = `<h3 style="margin:4px 4px 10px">Notifications</h3><div id="nl"></div>`;
  redraw = drawNotifs; drawNotifs();
  nlist.filter(n => !n.read).forEach(n => updateDoc(doc(db, "notifs", n.id), { read: true }).catch(() => {}));
}
function drawNotifs(){
  const l = $("#nl"); if (!l) return;
  const txt = n => n.type === "like" ? "ne aapki post ko like kiya" : n.type === "follow" ? "ne aapko follow kiya" : "ne comment kiya: " + esc((n.text || "").slice(0, 60));
  l.innerHTML = [...nlist].sort((a, b) => ms(b) - ms(a)).map(n =>
    `<div class="card row click ${unrSet.has(n.id) ? "unr" : ""}" data-a="${n.type === "follow" || !n.postId ? "prof" : "cmt"}" data-u="${n.from}" data-id="${n.postId || ""}" data-o="${me.uid}"><div class="grow"><b>${esc(n.fromName)}</b> ${txt(n)}<div class="mute">${when(n.createdAt)}</div></div></div>`
  ).join("") || `<p class="mute pad">Abhi koi notification nahi hai.</p>`;
}

/* ---------- profile ---------- */
function profile(uid){
  const mine = uid === me.uid;
  $("#app").innerHTML = `<div id="ph"></div><div id="pl"></div>`;
  let u = {}, followers = 0, posts = [];
  const draw = () => {
    const fl = (my.following || []).includes(uid), who = mine ? my : u;
    $("#ph").innerHTML = `<div class="card prof"><div class="av big">${avatar(who.name, who.ph)}</div><b class="pn">${esc(who.name)}</b><div class="mute">@${esc(who.h || "")}</div><p class="bio">${esc(who.bio || "")}</p>
      <div class="stats"><div><b>${posts.length}</b><span>Posts</span></div><div><b>${followers}</b><span>Followers</span></div><div><b>${(who.following || []).length}</b><span>Following</span></div></div>
      ${mine ? `<div class="row"><button data-a="editp">Profile edit karo</button><button class="sec" data-a="logout">Logout</button></div>`
             : `<div class="row"><button class="${fl ? "sec" : ""}" data-a="follow" data-u="${uid}">${fl ? "Following ✓" : "Follow karo"}</button><button class="sec" data-a="chat" data-id="${uid}" data-n="${esc(who.name)}">Message</button></div>`}</div>
      ${mine ? `<div class="chips"><button class="chip ${psub === "posts" ? "on" : ""}" data-a="psub" data-s="posts">Posts</button><button class="chip ${psub === "saved" ? "on" : ""}" data-a="psub" data-s="saved">Saved</button></div>` : ""}`;
    const list = (mine && psub === "saved") ? savedPosts : posts;
    $("#pl").innerHTML = list.map(x => postHtml(x.id, x.data)).join("") || `<p class="mute pad">Yahan abhi kuch nahi hai.</p>`;
  };
  psub = "posts"; redraw = draw; draw();
  subs.push(onSnapshot(doc(db, "users", uid), s => { u = s.data() || {}; draw(); }, () => {}));
  subs.push(onSnapshot(query(collection(db, "posts"), where("uid", "==", uid)), s => { posts = s.docs.map(d => ({ id: d.id, data: d.data() })).sort((a, b) => ms(b.data) - ms(a.data)); draw(); }, e => toast(errMsg(e))));
  subs.push(onSnapshot(query(collection(db, "users"), where("following", "array-contains", uid)), s => { followers = s.size; draw(); }, () => {}));
}
async function loadSaved(){
  const ids = (my.saved || []).slice(-30).reverse();
  const snaps = await Promise.all(ids.map(id => getDoc(doc(db, "posts", id)).catch(() => null)));
  savedPosts = snaps.filter(s => s && s.exists()).map(s => ({ id: s.id, data: s.data() }));
}
function editProfile(){
  profFile = null;
  const s = $("#sheet"); s.hidden = false;
  s.innerHTML = `<div class="sheet"><div class="row"><b class="grow">Profile edit</b><button class="ghost" data-a="close">✕</button></div>
    <input id="en" maxlength="40" placeholder="Naam" value="${esc(my.name || "")}">
    <textarea id="eb" maxlength="150" placeholder="Apne baare mein kuch likho">${esc(my.bio || "")}</textarea>
    ${PHOTO ? `<button class="sec" data-a="epick">📷 Profile photo badlo</button> <span id="epv" class="mute"></span><input type="file" id="ef" accept="image/*" hidden>` : ""}
    <div class="row" style="margin-top:10px"><button data-a="esave">Save karo</button></div></div>`;
}

function go(t, a){
  tab = t; clearSubs(); redraw = null; closeSheet(); closeStory();
  const nv = t === "chat" ? "msgs" : t === "prof" ? (a === me.uid ? "me" : "") : t === "notifs" ? "" : t;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.t === nv));
  if (t === "home") home(); else if (t === "explore") explore(); else if (t === "create") create();
  else if (t === "msgs") msgs(); else if (t === "me") profile(me.uid); else if (t === "prof") profile(a);
  else if (t === "chat") chat(a.uid, a.name); else if (t === "notifs") notifView();
  $("#app").scrollTop = 0;
}

/* ---------- actions ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if (a === "authmode") authView(b.dataset.m);
    else if (a === "tab") go(b.dataset.t);
    else if (a === "theme") setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    else if (a === "notifs") go("notifs");
    else if (a === "login") await signInWithEmailAndPassword(auth, $("#e").value.trim(), $("#p").value);
    else if (a === "signup") {
      const n = $("#n").value.trim(), em = $("#e").value.trim(), p = $("#p").value;
      if (!n) return toast("Apna naam likho.");
      signingUp = true;
      const c = await createUserWithEmailAndPassword(auth, em, p);
      await updateProfile(c.user, { displayName: n });
      await ensureUser(c.user, n);
      signingUp = false; await startSession(auth.currentUser);
    }
    else if (a === "logout") await signOut(auth);
    else if (a === "hf") { homeF = b.dataset.f; redraw && redraw(); }
    else if (a === "tag") { xq = b.dataset.t; go("explore"); }
    else if (a === "prof") { const u = b.dataset.u; if (u) go(u === me.uid ? "me" : "prof", u); }
    else if (a === "bg") { const i = +b.dataset.i; bgSel = bgSel === i ? null : i; applyBg(); }
    else if (a === "pick") $("#cf").click();
    else if (a === "unpick") { fileSel = null; $("#cp").innerHTML = ""; applyBg(); }
    else if (a === "post") await submit("post", b);
    else if (a === "spost") await submit("story", b);
    else if (a === "like") {
      const liked = b.dataset.l === "1";
      await updateDoc(doc(db, "posts", id), { likes: liked ? arrayRemove(me.uid) : arrayUnion(me.uid) });
      if (!liked) notify(b.dataset.o, "like", id);
    }
    else if (a === "save") {
      const s = b.dataset.s === "1";
      await updateDoc(doc(db, "users", me.uid), { saved: s ? arrayRemove(id) : arrayUnion(id) });
      toast(s ? "Saved se hata diya." : "Save ho gaya.");
    }
    else if (a === "share") {
      const t = (b.closest("article").querySelector(".txt,.gcard") || {}).textContent || "";
      const url = location.origin + location.pathname;
      try { if (navigator.share) await navigator.share({ title: "IndoChat", text: t.slice(0, 120), url }); else { await navigator.clipboard.writeText(url); toast("App ka link copy ho gaya."); } } catch(x){}
    }
    else if (a === "del") { if (confirm("Ye post hatani hai?")) await deleteDoc(doc(db, "posts", id)); }
    else if (a === "cmt") { if (id) openComments(id, b.dataset.o); }
    else if (a === "close") closeSheet();
    else if (a === "csend") {
      const t = $("#ci").value.trim(); if (!t) return;
      $("#ci").value = "";
      await addDoc(collection(db, "posts", id, "comments"), { uid: me.uid, name: nameOf(me), text: t, createdAt: serverTimestamp() });
      await updateDoc(doc(db, "posts", id), { cc: increment(1) });
      notify(b.dataset.o, "comment", id, t);
    }
    else if (a === "follow") {
      const u = b.dataset.u, fl = (my.following || []).includes(u);
      await updateDoc(doc(db, "users", me.uid), { following: fl ? arrayRemove(u) : arrayUnion(u) });
      if (!fl) notify(u, "follow");
    }
    else if (a === "psub") { psub = b.dataset.s; if (psub === "saved") await loadSaved(); redraw && redraw(); }
    else if (a === "editp") editProfile();
    else if (a === "epick") $("#ef").click();
    else if (a === "esave") {
      b.disabled = true;
      try {
        const name = $("#en").value.trim() || nameOf(me), bio = $("#eb").value.trim();
        const upd = { name, bio };
        if (profFile) upd.ph = await uploadImg(profFile);
        await updateDoc(doc(db, "users", me.uid), upd);
        await updateProfile(auth.currentUser, { displayName: name });
        closeSheet(); toast("Profile save ho gayi.");
      } catch(x){ b.disabled = false; throw x; }
    }
    else if (a === "chat") go("chat", { uid: id, name: b.dataset.n });
    else if (a === "msend") {
      const t = $("#mi").value.trim(); if (!t) return;
      $("#mi").value = "";
      await addDoc(collection(db, "chats", b.dataset.c, "messages"), { from: me.uid, text: t, createdAt: serverTimestamp() });
    }
    else if (a === "newstory") openComposeSheet("story");
    else if (a === "story") { const g = sv_groups.find(x => x.uid === b.dataset.u); if (g) { sv = { items: g.items, i: 0 }; showStory(); } }
    else if (a === "snext") { sv.i++; if (sv.i >= sv.items.length) closeStory(); else showStory(); }
    else if (a === "sclose") closeStory();
    else if (a === "sdel") { if (confirm("Ye story hatani hai?")) { await deleteDoc(doc(db, "stories", id)); closeStory(); } }
  } catch (err) { signingUp = false; toast(errMsg(err)); }
});
document.addEventListener("change", e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 15 * 1024 * 1024) return toast("Photo bahut badi hai (15 MB se kam chuno).");
  if (e.target.id === "cf") {
    fileSel = f; $("#cp").innerHTML = `<div class="pv"><img src="${URL.createObjectURL(f)}" alt=""><button data-a="unpick" aria-label="Photo hatao">✕</button></div>`; applyBg();
  } else if (e.target.id === "ef") { profFile = f; $("#epv").textContent = "Photo chuni gayi."; }
});
document.addEventListener("input", e => { if (e.target.id === "q") { xq = e.target.value; redraw && redraw(); } });
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  const id = e.target.id;
  if (id === "ci") document.querySelector('[data-a="csend"]').click();
  else if (id === "mi") document.querySelector('[data-a="msend"]').click();
  else if (id === "p") document.querySelector('[data-a="login"],[data-a="signup"]').click();
});

/* ---------- session ---------- */
async function startSession(u){
  me = u; $("#nav").hidden = false;
  await ensureUser(u);
  gsubs.forEach(f => f()); gsubs = [];
  gsubs.push(onSnapshot(doc(db, "users", u.uid), s => { my = s.data() || {}; redraw && redraw(); }, () => {}));
  gsubs.push(onSnapshot(query(collection(db, "notifs"), where("to", "==", u.uid)), s => {
    nlist = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const n = nlist.filter(x => !x.read).length, bd = $("#bd");
    bd.textContent = n > 9 ? "9+" : n; bd.hidden = !n;
    if (tab === "notifs") drawNotifs();
  }, () => {}));
  go(tab === "chat" || tab === "prof" ? "home" : tab);
}
onAuthStateChanged(auth, u => {
  if (!u) { me = null; my = {}; nlist = []; gsubs.forEach(f => f()); gsubs = []; clearSubs(); closeSheet(); closeStory(); $("#bd").hidden = true; authView("login"); return; }
  if (signingUp) return;
  startSession(u);
});
</script>
</body>
</html>
